name: 'pipeline-project'

on:
  push:
    branches:
      - main
    paths:
      - 'Q1/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Q1/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: 'Build and Push Docker Image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Notify Slack (Login)
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Login to Docker Hub passed'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Q1/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/test10:${{ github.sha }}

      - name: Notify Slack (Build Success)
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Build and push passed'

  terraform-deploy:
    name: 'Terraform Validate & Apply'
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: Q1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply Access Entries first
        run: |
          terraform apply -auto-approve \
            -target='module.my_infrastructure.module.eks.aws_eks_access_entry.this["cluster_creator"]' \
            -target='module.my_infrastructure.module.eks.aws_eks_access_policy_association.this["cluster_creator_admin"]'

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="deploy_apps=true" \
            -var="image_tag=${{ github.sha }}"

      - name: Get ALB Hostname
        id: alb
        run: |
          HOSTNAME=$(terraform output -raw alb_hostname)
          echo "hostname=$HOSTNAME" >> $GITHUB_OUTPUT
          echo "ALB Hostname: $HOSTNAME"

      - name: Notify Slack with ALB URL
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "Deployment Successful"
          SLACK_MESSAGE: "The application has been deployed successfully!\nALB URL: http://${{ steps.alb.outputs.hostname }}"